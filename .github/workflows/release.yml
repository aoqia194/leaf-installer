name: Release

on:
  workflow_dispatch:
    inputs:
      is_snapshot:
        type: boolean
        description: "Publish as a snapshot?"
        default: true
  push:
    tags:
      - 'v*'

jobs:
  pre:
    runs-on: ubuntu-latest
    outputs:
      # Assume pushes to tags are always full releases
      is_full_release: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.is_snapshot == false) }}
    steps:
      - run: "true"
  release:
    name: Release
    needs: pre
    runs-on: ubuntu-latest
    environment: publishing
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      # If this isn't a snapshot release, publish a snapshot release so that they are both up-to-date.
      - name: Sync Snapshot
        if: needs.pre.outputs.is_full_release == 'true'
        run: ./gradlew publish -S
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE_KEY }}
          ORG_GRADLE_PROJECT_mavenUsername: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenPassword: ${{ secrets.MAVEN_PASSWORD }}
          ORG_GRADLE_PROJECT_isSnapshot: true
      - name: Release
        run: ./gradlew publish -S
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE_KEY }}
          ORG_GRADLE_PROJECT_mavenUsername: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenPassword: ${{ secrets.MAVEN_PASSWORD }}
          ORG_GRADLE_PROJECT_isSnapshot: ${{ needs.pre.outputs.is_full_release != 'true' }}
      - name: Generate Changelog
        if: needs.pre.outputs.is_full_release == 'true'
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: ".cliff.toml"
          args: --latest -v
        env:
          GITHUB_REPO: ${{ github.repository }}
      - name: Create GitHub Release
        if: needs.pre.outputs.is_full_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            build/libs/*!(SNAPSHOT)*.jar
          body: ${{ steps.cliff.outputs.content }}