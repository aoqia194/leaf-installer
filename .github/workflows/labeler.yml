name: Labeler

on:
  issues:
    types:
      - opened
  pull_request:
    types:
      - opened
  # pull_request_target:

jobs:
  labeler:
    name: Labeler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Try label from title
        # v3.5
        uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67
        with:
          configuration-path: .github/labeler.yml
          not-before: 2026-10-3T00:00:00Z
          enable-versioned-regex: 0
          include-title: 1
          sync-labels: 0
          repo-token: ${{ github.token }}
  labeler-fallback:
    name: Labeler (Fallback)
    needs: labeler
    if: ${{ always() && needs.labeler.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Try label using fallback
        # v7.0.0
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13
        with:
          configuration-path: .github/labeler-fallback.yml
          sync-labels: false
          repo-token: ${{ github.token }}
